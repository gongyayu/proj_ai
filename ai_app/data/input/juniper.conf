    policy-statement BGP-BASE-OUT {
        term PROTO-STATIC {
            from {
                protocol static;
                policy SUB-STATIC-TO-BGP;
            }
            then {
                metric 0;
                local-preference 500;
                origin igp;
                next policy;
            }
        }
        term PROTO-DIRECT {
            from {
                protocol direct;
                policy SUB-DIRECT-TO-BGP;
            }
            then {
                metric 0;
                local-preference 500;
                origin igp;
                next policy;
            }
        }
        term PROTO-BGP {
            from protocol bgp;
            then next policy;
        }
        term REJECT-ALL {
            then reject;
        }
    }
    policy-statement BGP-DEFAULTORIG-ADD {
        term INJECT-DEFAULT {
            from policy SUB-DEFAULT-TO-BGP;
            then accept;
        }
        term NEXT-POLICY-ALL {
            then next policy;
        }
    }
    policy-statement BGP-DEFAULTORIG-ONLY {
        term INJECT-DEFAULT {
            from policy SUB-DEFAULT-TO-BGP;
            then accept;
        }
        term NO-COM {
            from community [ ETYPE-TRANS-COM ETYPE-PEER-COM ];
            then reject;
        }
        term NEXT-POLICY-ALL {
            then next policy;
        }
    }
    policy-statement BGP-FULLROUTES-OUT {
        term REJECT-ZERO-NETS {
            from {
                route-filter 0.0.0.0/0 exact;
                route-filter 0.0.0.0/8 orlonger;
            }
            then reject;
        }
        term REJECT-BOGONS {
            from {
                prefix-list IP4-BOGON-NETS;
            }
            then reject;
        }
        term ADVERTISE-ALL {
            from protocol bgp;
            then {
                community delete STRIP-EXT-COMMS;
                accept;
            }
        }
        term NEXT-POLICY-ALL {
            then next policy;
        }
    }
    policy-statement BGP-RPKI-CHECK {
        term UNKNOWN {
            from validation-database unknown;
            then {
                validation-state unknown;
                community add RPKI-UNKNOWN;
                next policy;
            }
        }
        term VALID {
            from validation-database valid;
            then {
                validation-state valid;
                community add RPKI-VALID;
                next policy;
            }
        }
        term INVALID {
            from validation-database invalid;
            then {
                validation-state invalid;
                community add RPKI-INVALID;
                next policy;
            }
        }
    }
    policy-statement EBGP-IP4-AS13476-IN {
        term BLACKHOLE {
            from {
                community TE-BLACKHOLE;
                prefix-list-filter IP4-AS13476-NETS orlonger;
            }
            then next policy;
        }
        term STANDARD {
            from {
                prefix-list-filter IP4-AS13476-NETS exact;
            }
